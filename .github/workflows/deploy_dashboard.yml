name: Publish Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Daily Political Intelligence Scraper
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dashboard export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth

      - name: Create Google service-account file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p credentials
          python - <<'PY'
          import os
          from pathlib import Path
          value = os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
          if not value.strip():
              raise RuntimeError("GOOGLE_SERVICE_ACCOUNT_JSON secret is empty.")
          Path("credentials/service_account.json").write_text(value, encoding="utf-8")
          PY

      - name: Generate public dashboard data
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: credentials/service_account.json
          GOOGLE_SHEETS_ID: 1grlbuXqu84eBwEEiKvKUuVjnET9zA76ESa1G5xcvMNI
          AI_ANALYSIS_SHEET: AI Analysis
          DASHBOARD_DATA_FILE: dashboard/data/dashboard-data.json
        run: python scripts/export_dashboard_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
